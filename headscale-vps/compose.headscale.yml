services:
  headscale:
    container_name: headscale
    image: headscale/headscale:0.29.3
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3478:3478/udp" # DERP/STUN
    volumes:
      - ${PODMAN_DATA}/headscale/config:/etc/headscale:Z
      - ${PODMAN_DATA}/headscale/data:/var/lib/headscale:Z
      - ${PODMAN_DATA}/certs:/etc/headscale/certs:z,ro
    entrypoint: headscale serve
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      me.tale.headplane.target: headscale

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    container_name: headplane
    restart: unless-stopped
    ports:
      - "3001:3001"
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - label=disable
    volumes:
      - ${PODMAN_DATA}/headplane/config/config.yaml:/etc/headplane/config.yaml:Z
      - ${PODMAN_DATA}/headscale/config/config.yaml:/etc/headscale/config.yaml:z
      - ${PODMAN_DATA}/headplane/data:/var/lib/headplane:Z
      - ${PODMAN_DATA}/headscale/data:/var/lib/headscale:z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
    depends_on:
      - headscale

  stun:
    image: ghcr.io/coturn/coturn:4.17
    container_name: stun
    restart: unless-stopped

    command:
      - turnserver
      - --stun-only
      - --no-cli
      - --no-tls
      - --no-dtls
      - --listening-port=3479
      - --listening-ip=0.0.0.0

    ports:
      - "3479:3479/udp"

    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
 default:
   driver: bridge
   enable_ipv6: true
